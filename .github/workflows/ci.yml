# Continuous integration: runs on every push and pull request.
# Not yet executed remotely (no Git remote configured).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_DATABASE: sahakarios_test
          MYSQL_USER: sahakarios
          MYSQL_PASSWORD: ci_only
          MYSQL_ROOT_PASSWORD: ci_root_only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -usahakarios -pci_only --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:8.2.10-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PASSWORD: ci_only
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, bcmath, intl, redis
          coverage: none
      - name: Allow trigger creation (audit log is append-only via triggers)
        run: mysql -h 127.0.0.1 -uroot -pci_root_only -e "SET GLOBAL log_bin_trust_function_creators = 1"
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: ./vendor/bin/pint --test
      - run: php artisan test
      - run: composer audit

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
