# Serves the Laravel API: static files from backend/public, PHP via php-fpm.
server {
    listen 80;
    server_name _;
    root /var/www/backend/public;
    index index.php;

    client_max_body_size 10m;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Block dotfiles such as .env if they ever end up under public/.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
