# Local development environment. Not a production configuration.
# All credentials below are throwaway local values (see backend/.env.example).
name: sahakarios

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: sahakarios
      MYSQL_USER: sahakarios
      MYSQL_PASSWORD: local_dev_only
      MYSQL_ROOT_PASSWORD: local_dev_root_only
    # log-bin-trust-function-creators: lets the app user create the triggers that
    # make audit_logs append-only while binary logging is on (MySQL 8.4 default).
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--log-bin-trust-function-creators=1"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    # No host port: only other containers reach MySQL. Add one locally if you need a GUI client.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -usahakarios -plocal_dev_only --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:8.2.10-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: sahakarios-api:dev
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # php-fpm has no HTTP port; check the master process is alive.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Runs scheduled tasks (e.g. sms:send every minute). Same image as the API.
  scheduler:
    image: sahakarios-api:dev
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.28.3-alpine
    volumes:
      - ./backend:/var/www/backend:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Full-stack check: nginx -> php-fpm -> Laravel -> MySQL + Redis.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    image: node:22.23.3-alpine
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    environment:
      # Server-side calls go container-to-container; never exposed to the browser.
      API_INTERNAL_URL: http://nginx
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./frontend:/app
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      nginx:
        condition: service_healthy

volumes:
  mysql-data:
